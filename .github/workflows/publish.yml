name: publish

# Publishing is opt-in. Set the repository variable PUBLISH_ENABLED=true and
# configure PyPI Trusted Publishing plus an NPM_TOKEN secret. Without both, this
# workflow only builds and verifies the artefacts; it never publishes.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  NPM_VERSION: "11"

jobs:
  python:
    name: Build and optionally publish the Python package
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build --outdir dist python/hcs_materials
      - run: python -m twine check dist/*
      - name: Publish to PyPI (Trusted Publishing)
        if: vars.PUBLISH_ENABLED == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  npm:
    name: Build and optionally publish npm packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@$NPM_VERSION
      - run: npm ci
      - run: npm run build:packages
      - name: Pack every publishable workspace (dry run)
        run: |
          for pkg in contracts core ui visualization wasm webgpu cli; do
            npm pack --dry-run -w "@hcs-materials/$pkg"
          done
      - name: Publish with provenance
        if: vars.PUBLISH_ENABLED == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for pkg in contracts core ui visualization wasm webgpu cli; do
            npm publish -w "@hcs-materials/$pkg" --access public --provenance
          done
