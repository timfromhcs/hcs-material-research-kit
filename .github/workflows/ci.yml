name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # npm 10's arborist cannot resolve the Vitest 4 peer graph; pin npm 11.
  NPM_VERSION: "11"

jobs:
  typescript:
    name: TypeScript, unit tests and studio build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@$NPM_VERSION
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Benchmark parity gate (fails on CPU/WASM disagreement)
        run: node benchmarks/lj-benchmark.mjs
      - name: Upload studio bundle
        uses: actions/upload-artifact@v7
        with:
          name: hcs-studio-dist
          path: apps/web/dist
          retention-days: 7
          if-no-files-found: error

  node24:
    name: Node 24 compatibility (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm install -g npm@$NPM_VERSION
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  rust:
    name: Rust kernels and cross-language parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm install -g npm@$NPM_VERSION
      - run: npm ci
      - run: npm run build:packages
      - name: Regenerate reference fixtures and fail on drift
        run: |
          npx tsx scripts/make-reference-fixtures.ts
          git diff --exit-code tests/fixtures/reference
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test -p hcs-compute-core -p hcs-compute-wasm
      - name: Verify the committed WASM asset matches its manifest
        run: node scripts/check-wasm-asset.mjs
      - name: Rebuild WASM and run the WASM suite against the fresh build
        run: |
          npm run build:wasm
          npx vitest run packages/wasm
          git checkout -- packages/wasm/wasm

  python:
    name: Python ${{ matrix.python-version }}, CLI and MCP
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package with test and MCP extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install "./python/hcs_materials[dev]"
      - name: Run tests
        working-directory: python/hcs_materials
        run: python -m pytest -q

  e2e:
    name: End-to-end acceptance workflow (Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@$NPM_VERSION
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: "true"
          PW_CHANNEL: chromium
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
