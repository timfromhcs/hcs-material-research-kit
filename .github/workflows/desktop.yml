name: desktop

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  NPM_VERSION: "11"

jobs:
  bundle:
    name: Tauri bundle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis,msi
          - os: ubuntu-latest
            bundles: deb,appimage
          - os: macos-latest
            bundles: dmg
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@$NPM_VERSION
      - run: npm ci

      - name: Install Linux WebView and bundling dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Build the studio bundle
        run: npm run build -w @hcs-materials/web

      - name: Build the desktop bundles (unsigned)
        working-directory: apps/desktop
        run: npx tauri build --bundles ${{ matrix.bundles }}
        env:
          RUST_BACKTRACE: "1"

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: hcs-desktop-${{ matrix.os }}
          path: apps/desktop/src-tauri/target/release/bundle/**/*
          retention-days: 14
          if-no-files-found: error
