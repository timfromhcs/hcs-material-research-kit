[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "hcs-materials"
version = "0.1.0"
description = "HCS Material Research Kit — local-first structure validation, project archives and MCP tools"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "hcsmedia and timfromhcs" }]
keywords = ["materials", "simulation", "crystallography", "reproducibility"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "jsonschema>=4.22",
]

[project.optional-dependencies]
mcp = ["mcp>=2.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "mcp>=2.0"]

[project.scripts]
hcs-materials = "hcs_materials.cli:main"

[project.urls]
Homepage = "https://github.com/hcsmedia/hcs-material-research-kit"
Documentation = "https://github.com/hcsmedia/hcs-material-research-kit/tree/main/docs"

[tool.hatch.build.targets.wheel]
packages = ["src/hcs_materials"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "pyproject.toml", "schemas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
