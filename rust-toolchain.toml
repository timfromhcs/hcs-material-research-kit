# Pinned so the committed WebAssembly asset is always rebuilt with the compiler
# recorded in packages/wasm/wasm/MANIFEST.json. Byte identity across operating
# systems is not guaranteed (the compiler embeds build metadata); CI therefore
# verifies the asset hash and runs the full WASM suite against a fresh rebuild.
[toolchain]
channel = "1.96.0"
components = ["rustfmt", "clippy"]
targets = ["wasm32-unknown-unknown"]
